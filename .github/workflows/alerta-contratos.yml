name: Alerta de troca de contrato (WIN/WDO)

# Todo dia útil, às 06:00 e às 10:00 (Brasília), verifica se há troca de contrato:
#  - dia anterior à troca: avisa às 06h e às 10h
#  - dia da troca: avisa às 06h
# Envia no grupo RECICLA TRADERS (Telegram). Também pode ser disparado na mão: Actions > "Alerta de troca de contrato"
# > Run workflow (por padrão em modo TESTE: não envia nada).
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 06:00 Brasília
    - cron: '0 13 * * 1-5'   # 10:00 Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo teste (não envia nada)'
        type: boolean
        default: true

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Verifica vencimentos e avisa
        run: node scripts/alerta-contratos.js
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
