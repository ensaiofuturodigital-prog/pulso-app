name: Telegram News Radar

on:
  schedule:
    - cron: '17 3 * * *'   # 00h17 Brasília
    - cron: '17 7 * * *'   # 04h17 Brasília
    - cron: '17 10 * * *'  # 07h17 Brasília
    - cron: '17 14 * * *'  # 11h17 Brasília
    - cron: '17 18 * * *'  # 15h17 Brasília
    - cron: '17 21 * * *'  # 18h17 Brasília
    - cron: '17 1 * * *'   # 22h17 Brasília (madrugada seguinte em UTC)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/telegram-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
