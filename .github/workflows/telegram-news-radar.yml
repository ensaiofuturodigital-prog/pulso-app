name: Telegram News Radar

on:
  schedule:
    - cron: '17 * * * *'   # todo dia, todo hora, no minuto 17 — 00:17, 01:17 … 23:17
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar envio agora (só teste)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anti-duplo — verifica se já foi enviado nesta hora
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "Envio forçado manualmente (teste)."
            exit 0
          fi
          # Busca as últimas 10 runs bem-sucedidas e rejeita se alguma rodou
          # nos últimos 50 min (garante no máximo 1 envio por hora).
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telegram-news-radar.yml/runs?status=success&per_page=10")
          ALREADY=$(echo "$RESP" | python3 -c "
import json,sys,datetime
d=json.load(sys.stdin)
current=${{ github.run_id }}
now=datetime.datetime.utcnow()
found=any(
  r['id']!=current and
  (now - datetime.datetime.strptime(r['created_at'],'%Y-%m-%dT%H:%M:%SZ')).total_seconds() < 3000
  for r in d.get('workflow_runs',[])
)
print('true' if found else 'false')
")
          if [ "$ALREADY" = "true" ]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Já teve envio com sucesso nos últimos 50 min — pulando para não duplicar."
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "OK — nenhum envio recente detectado, pode mandar."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_send == 'true'
        with:
          node-version: '22'
      - run: npm install
        if: steps.check.outputs.should_send == 'true'
      - run: node scripts/telegram-news-radar.js
        if: steps.check.outputs.should_send == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
