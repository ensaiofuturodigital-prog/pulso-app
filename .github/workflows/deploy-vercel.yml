name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita a corrida entre deploys: se chegar um push novo enquanto o deploy
# anterior ainda está rodando, ele espera na fila em vez de rodar em paralelo.
# Sem isso, um deploy de um commit mais antigo podia terminar DEPOIS de um mais
# novo e "vencer" virando a versão em produção por engano (foi o que aconteceu
# em 01/08/2026 com 3 pushes em sequência rápida).
concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json << JSON
          {"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}
          JSON

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
