name: Fetch News Radar

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-news-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Coleta notícias (roda sempre)
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Envia Radar ao Telegram (roda nos :30)
        run: |
          MINUTE=$(date -u +%M)
          echo "Minuto atual (UTC): $MINUTE"
          if [ "$MINUTE" = "30" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Minuto :30 ou dispatch manual — enviando ao Telegram..."
            node scripts/telegram-news-radar.js
          else
            echo "⏭️  Minuto :00 — só coletou, não envia Telegram."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
