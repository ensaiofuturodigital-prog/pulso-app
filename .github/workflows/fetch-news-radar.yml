name: Fetch News Radar

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-news-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Coleta notícias (roda sempre)
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Envia Radar de Notícias ao Telegram (roda nos :30)
        run: |
          MINUTE=$(date -u +%M)
          if [ "$MINUTE" = "30" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Enviando radar de notícias..."
            node scripts/telegram-news-radar.js
          else
            echo "⏭️  Minuto :00 — só coletou notícias."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Envia Probabilidades WDO/WIN ao Telegram (08:30 UTC = 05:30 Brasília, seg-sex)
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          WEEKDAY=$(date -u +%u)
          FORCE="${{ github.event.inputs.force_daily || 'false' }}"
          if [ "$FORCE" = "true" ] || ([ "$HOUR" = "08" ] && [ "$MINUTE" = "30" ] && [ "$WEEKDAY" -le "5" ]); then
            echo "✅ Enviando probabilidades WDO/WIN..."
            node scripts/telegram-daily-report.js
          else
            echo "⏭️  Não é horário das probabilidades (08:30 UTC seg-sex)."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_daily || 'false' }}
