name: Fetch News Radar

on:
  schedule:
    - cron: '*/15 * * * *'   # coleta a cada 15 min — notícias sempre frescas
  workflow_dispatch:
    inputs:
      force_telegram:
        description: 'Forçar envio ao Telegram agora (teste)'
        required: false
        default: 'false'

concurrency:
  group: fetch-news-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      # PASSO 1 — Sempre coleta e salva as notícias no Supabase
      - name: Coleta notícias dos 10 feeds RSS profissionais
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # PASSO 2 — Envia ao Telegram só nos 7 horários fixos (Brasília)
      # Horários: 00:17 / 04:17 / 07:17 / 11:17 / 15:17 / 18:17 / 22:17
      - name: Envia Radar ao Telegram (só nos horários fixos)
        run: |
          FORCE="${{ github.event.inputs.force_telegram }}"
          if [ "$FORCE" = "true" ]; then
            echo "Envio forçado manualmente."
            node scripts/telegram-news-radar.js
            exit 0
          fi
          NOW=$(TZ='America/Sao_Paulo' date +%H:%M)
          SEND="false"
          for T in 00:17 04:17 07:17 11:17 15:17 18:17 22:17; do
            DIFF=$(python3 -c "
from datetime import datetime
now=datetime.strptime('$NOW','%H:%M')
t=datetime.strptime('$T','%H:%M')
diff=(now-t).total_seconds()/60
diff=diff+1440 if diff<0 else diff
print(int(diff))")
            if [ "$DIFF" -ge 0 ] && [ "$DIFF" -lt 20 ]; then
              SEND="true"
            fi
          done
          if [ "$SEND" = "true" ]; then
            echo "✅ Horário de envio detectado ($NOW Brasília) — enviando ao Telegram..."
            node scripts/telegram-news-radar.js
          else
            echo "⏭️  $NOW (Brasília) — só coletou, não é hora de enviar ao Telegram."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
