name: Probabilidades WDO/WIN

on:
  schedule:
    - cron: '30 8 * * 1-5'   # 05:30 Brasília (1º envio)
    - cron: '30 9 * * 1-5'   # 06:30 Brasília (2º envio)
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Forçar envio agora (ignora dia útil e duplicata)'
        required: false
        default: 'false'

concurrency:
  group: probabilidades
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Envia probabilidades WDO/WIN ao Telegram (dia útil + duplicata checados no script)
        run: node scripts/telegram-daily-report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
