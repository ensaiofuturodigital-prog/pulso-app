name: Probabilidades WDO/WIN

on:
  schedule:
    - cron: '37 8 * * 1-5'   # 05:37 Brasília (horário principal)
    - cron: '7 9 * * 1-5'    # 06:07 Brasília (backup — só envia se o principal falhou)
  workflow_dispatch:

concurrency:
  group: probabilidades
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Verifica se já foi enviado hoje (anti-duplicata para o backup)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          # Se for o horário principal (08:37 UTC), envia sempre
          if [ "$HOUR" = "08" ] && [ "$MINUTE" = "37" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "Horário principal (05:37 Brasília) — enviando."
            exit 0
          fi
          # Se for o backup (09:07 UTC), só envia se não houve sucesso hoje
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probabilidades.yml/runs?status=success&per_page=5")
          TODAY=$(date -u +%Y-%m-%d)
          ALREADY=$(echo "$RESP" | python3 -c "
import json,sys
d=json.load(sys.stdin)
runs=d.get('workflow_runs',[])
found=any(r['created_at'].startswith('$TODAY') for r in runs)
print('true' if found else 'false')
")
          if [ "$ALREADY" = "true" ]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Backup (06:07 Brasília) — principal já rodou hoje com sucesso, pulando."
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "Backup (06:07 Brasília) — principal não rodou hoje, enviando agora."
          fi

      - name: Envia probabilidades WDO/WIN ao Telegram
        if: steps.check.outputs.should_send == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/telegram-daily-report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: 'true'
