name: Pulso Radar

on:
  schedule:
    - cron: '*/15 * * * *'   # coleta notícias a cada 15 min — sempre frescas
  workflow_dispatch:
    inputs:
      force_telegram:
        description: 'Forçar envio ao Telegram agora (teste)'
        required: false
        default: 'false'

concurrency:
  group: pulso-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # Rede de segurança: sem isso, o job podia travar por até 6h (padrão do
    # GitHub Actions) se algum site externo não respondesse. E com o
    # "concurrency" acima (cancel-in-progress: false), um job travado
    # enfileirava TODAS as próximas execuções atrás dele — foi a causa real
    # dos atrasos de horas que vínhamos vendo. Corrigido também na raiz
    # (timeout nas chamadas de tradução em fetch-news-radar.js); isto aqui é
    # só a segunda camada de proteção.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Coleta notícias dos feeds RSS profissionais
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENVIAR_URGENTE: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Envia Radar ao Telegram (decisão de horário é feita no próprio script)
        run: node scripts/telegram-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_telegram }}

      # Reforço: o workflow "Probabilidades WDO/WIN" tem seu próprio gatilho
      # (cron do GitHub + cron da Vercel), mas se ambos falharem num dia, essa
      # chamada aqui pega o problema de qualquer jeito — o Radar dispara com
      # muito mais frequência e vem se mostrando o canal mais confiável. Sem
      # risco de duplicar: o script já checa sozinho se as probabilidades de
      # hoje já foram enviadas (trava no Supabase) e só manda se não foram.
      - name: Reforço - garante que as probabilidades do dia também saíram
        run: node scripts/telegram-daily-report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
