name: Pulso Radar

on:
  schedule:
    - cron: '*/15 * * * *'   # coleta notícias a cada 15 min — sempre frescas
  workflow_dispatch:
    inputs:
      force_telegram:
        description: 'Forçar envio ao Telegram agora (teste)'
        required: false
        default: 'false'

concurrency:
  group: pulso-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Coleta notícias dos feeds RSS profissionais
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Envia Radar ao Telegram (decisão de horário é feita no próprio script)
        run: node scripts/telegram-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_telegram }}
