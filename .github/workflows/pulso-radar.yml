name: Pulso Radar

on:
  schedule:
    - cron: '*/15 * * * *'   # coleta notícias a cada 15 min — sempre frescas
  workflow_dispatch:
    inputs:
      force_telegram:
        description: 'Forçar envio ao Telegram agora (teste)'
        required: false
        default: 'false'

concurrency:
  group: pulso-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      # PASSO 1 — Sempre coleta e salva no Supabase
      - name: Coleta notícias dos 10 feeds RSS profissionais
        run: node scripts/fetch-news-radar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # PASSO 2 — Telegram só nos 7 horários fixos (Brasília) ou force manual
      - name: Envia Radar ao Telegram (horários fixos ou manual)
        run: |
          FORCE="${{ github.event.inputs.force_telegram }}"
          if [ "$FORCE" = "true" ]; then
            echo "✅ Envio forçado manualmente."
            node scripts/telegram-news-radar.js
            exit 0
          fi
          NOW=$(TZ='America/Sao_Paulo' date +%H:%M)
          SEND="false"
          for T in 00:17 04:17 07:17 11:17 15:17 18:17 22:17; do
            DIFF=$(python3 -c "
from datetime import datetime
now=datetime.strptime('$NOW','%H:%M')
t=datetime.strptime('$T','%H:%M')
diff=(now-t).total_seconds()/60
diff=diff+1440 if diff<0 else diff
print(int(diff))")
            if [ "$DIFF" -ge 0 ] && [ "$DIFF" -lt 20 ]; then
              SEND="true"
            fi
          done
          if [ "$SEND" = "true" ]; then
            echo "✅ $NOW (Brasília) — enviando ao Telegram..."
            node scripts/telegram-news-radar.js
          else
            echo "⏭️  $NOW (Brasília) — só coletou, fora dos horários de envio."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
