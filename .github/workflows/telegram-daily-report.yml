name: Telegram Daily Report

on:
  schedule:
    - cron: '7 9 * * *'  # todo dia às 09h07 UTC (06h07 Brasília) — fora da hora cheia pra evitar atraso/perda do agendamento
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar envio mesmo em fim de semana/feriado (só pra teste)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/telegram-daily-report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force }}
